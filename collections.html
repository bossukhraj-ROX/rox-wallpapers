<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROX | Collections</title>

<meta name="description"
content="Browse every premium wallpaper collection available from ROX.">

<meta name="theme-color" content="#08101f">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

scroll-behavior:smooth;

}

:root{

--bg:#050914;

--bg2:#0b1730;

--glass:rgba(255,255,255,.08);

--glass-border:rgba(255,255,255,.12);

--text:#ffffff;

--muted:#bfc8d8;

--accent:#4da3ff;

--radius:24px;

--shadow:0 25px 60px rgba(0,0,0,.35);

}

body{

font-family:"Inter",sans-serif;

background:
radial-gradient(circle at top,#18396f 0%,#08101f 40%,#050914 100%);

background-attachment:fixed;

color:var(--text);

overflow-x:hidden;

min-height:100vh;

}

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at 20% 20%,
rgba(77,163,255,.12),
transparent 35%),

radial-gradient(circle at 80% 30%,
rgba(140,180,255,.08),
transparent 35%),

radial-gradient(circle at 50% 100%,
rgba(77,163,255,.08),
transparent 45%);

animation:bgMove 18s ease-in-out infinite alternate;

pointer-events:none;

z-index:-1;

}

@keyframes bgMove{

0%{

transform:translateY(0);

}

100%{

transform:translateY(-80px);

}

}

.container{

width:min(1200px,92%);

margin:auto;

}

.glass{

background:var(--glass);

backdrop-filter:blur(22px);

-webkit-backdrop-filter:blur(22px);

border:1px solid var(--glass-border);

box-shadow:var(--shadow);

border-radius:var(--radius);

}

a{

text-decoration:none;

color:white;

}

img{

display:block;

max-width:100%;

}

section{

padding:120px 0;

}

.button{

display:inline-flex;

align-items:center;

justify-content:center;

padding:16px 34px;

border-radius:999px;

font-weight:700;

transition:.35s;

cursor:pointer;

}

.button-primary{

background:linear-gradient(135deg,#4da3ff,#78b8ff);

color:#08101f;

}

.button-primary:hover{

transform:translateY(-6px);

box-shadow:0 18px 40px rgba(77,163,255,.35);

}

.button-secondary{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

}

.button-secondary:hover{

background:rgba(255,255,255,.14);

transform:translateY(-6px);

}

/* ---------- NAVBAR ---------- */

.navbar{

position:fixed;

top:18px;

left:50%;

transform:translateX(-50%);

width:min(1180px,94%);

display:flex;

align-items:center;

justify-content:space-between;

padding:18px 28px;

z-index:1000;

transition:.4s;

}

.logo{

font-size:1.5rem;

font-weight:900;

letter-spacing:.08em;

}

.nav-links{

display:flex;

gap:26px;

align-items:center;

}

.nav-links a{

font-weight:600;

color:white;

transition:.3s;

}

.nav-links a:hover{

color:#8dc6ff;

}

.dropdown{

position:relative;

}

.dropdown-content{

position:absolute;

top:45px;

right:0;

min-width:220px;

padding:14px;

display:none;

flex-direction:column;

gap:12px;

border-radius:18px;

background:rgba(15,20,40,.92);

backdrop-filter:blur(18px);

}

.dropdown:hover .dropdown-content{

display:flex;

}
    /* ---------- HERO ---------- */

.hero{

padding-top:180px;

padding-bottom:110px;

text-align:center;

}

.hero-badge{

display:inline-flex;

align-items:center;

justify-content:center;

padding:12px 24px;

border-radius:999px;

margin-bottom:24px;

font-size:.95rem;

font-weight:700;

}

.hero h1{

font-size:clamp(3rem,7vw,5rem);

font-weight:900;

line-height:1.05;

margin-bottom:22px;

}

.hero p{

max-width:760px;

margin:auto;

font-size:1.15rem;

line-height:1.9;

color:var(--muted);

}

/* ---------- FEATURED COLLECTION ---------- */

.featured-grid{

display:grid;

grid-template-columns:1.1fr 1fr;

gap:70px;

align-items:center;

}

.featured-image img{

border-radius:32px;

box-shadow:0 35px 80px rgba(0,0,0,.45);

}

.featured-content h2{

font-size:2.8rem;

margin:20px 0;

font-weight:900;

}

.featured-content p{

line-height:1.9;

color:var(--muted);

margin-bottom:20px;

}

.compatibility{

display:inline-flex;

align-items:center;

padding:12px 18px;

border-radius:999px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

margin:18px 0 28px;

font-weight:600;

}

/* ---------- PREVIEW GRID ---------- */

.preview-grid{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:18px;

margin:40px 0;

}
.preview-card{

position:relative;

aspect-ratio:9 / 19.5;

overflow:hidden;

border-radius:20px;

background:#0b1325;

border:1px solid rgba(255,255,255,.10);

transition:.45s;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

}

.preview-card img{

width:100%;

height:100%;

object-fit:cover;

object-position:top center;

display:block;

transition:.45s;

}

.preview-card:hover{

transform:translateY(-12px);

}

.preview-card:hover img{

transform:scale(1.05);

}
