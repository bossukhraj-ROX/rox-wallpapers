<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the five live ROX premium wallpaper collections.">
  <title>ROX | Explore Collections</title>
  <style>
    :root { --rox-ink:#102d4e; --rox-paper:#eaf5fb; --rox-line:rgba(255,255,255,.72); --rox-ease:cubic-bezier(.22,1,.36,1); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--rox-ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 50% 16%,rgba(255,255,255,.88),transparent 29rem),radial-gradient(circle at 14% 78%,rgba(255,186,121,.24),transparent 27rem),linear-gradient(155deg,#6f91aa,#bdced7 52%,#6f8ea5); }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:3px solid rgba(39,111,190,.62); outline-offset:4px; border-radius:12px; }
    .site-header { position:relative; z-index:20; padding:18px 20px 0; }
    .nav { width:min(1180px,100%); min-height:64px; margin:auto; padding:8px 10px 8px 19px; display:flex; align-items:center; justify-content:space-between; gap:18px; border:1px solid var(--rox-line); border-radius:999px; background:rgba(240,249,255,.52); box-shadow:0 14px 38px rgba(18,51,77,.15),inset 0 1px 0 rgba(255,255,255,.94); backdrop-filter:blur(18px) saturate(130%); -webkit-backdrop-filter:blur(18px) saturate(130%); }
    .brand { padding:.4rem .55rem; color:var(--rox-ink); font-weight:900; letter-spacing:.13em; }
    .nav-links { display:flex; gap:.25rem; padding:0; margin:0; list-style:none; }
    .nav-links a { display:block; min-height:40px; padding:.62rem .9rem; border-radius:999px; font-size:.88rem; font-weight:760; }
    main { min-height:calc(100vh - 100px); display:grid; place-items:center; padding:5.5rem 20px 8rem; }
    .rox-bridge { width:min(650px,100%); padding:clamp(2rem,6vw,4rem); text-align:center; border:1px solid var(--rox-line); border-radius:34px; background:linear-gradient(135deg,rgba(248,253,255,.62),rgba(205,228,242,.31)); box-shadow:0 32px 72px rgba(13,43,70,.2),inset 0 1px 0 rgba(255,255,255,.95); backdrop-filter:blur(20px) saturate(128%); -webkit-backdrop-filter:blur(20px) saturate(128%); }
    .rox-bridge img { width:clamp(76px,12vw,110px); height:auto; margin:0 auto 1.25rem; filter:drop-shadow(0 12px 22px rgba(16,58,98,.18)); }
    .rox-bridge p { max-width:420px; margin:.75rem auto 1.7rem; color:#385775; line-height:1.65; }
    .rox-bridge h1 { margin:0; font-size:clamp(2rem,5vw,3.5rem); letter-spacing:-.065em; line-height:1; }
    .rox-bridge .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:.78rem 1.15rem; border-radius:999px; color:#fff; background:linear-gradient(135deg,#173d68,#326fa7); box-shadow:0 13px 25px rgba(18,62,106,.23),inset 0 1px 0 rgba(255,255,255,.3); font-size:.9rem; font-weight:800; transition:transform 220ms var(--rox-ease),box-shadow 220ms var(--rox-ease); }
    .rox-bridge .button:hover { transform:translateY(-3px); box-shadow:0 18px 31px rgba(18,62,106,.3),inset 0 1px 0 rgba(255,255,255,.3); }
    .site-footer { margin:0; padding:0 20px 24px; text-align:center; }
    .footer-brand,.footer-links,.footer-email,.copyright { display:none; }
    @media (max-width:720px) { .site-header { padding:12px 14px 0; } .nav { min-height:58px; } main { padding:4.5rem 16px 7rem; } .rox-bridge { border-radius:28px; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition-duration:.01ms!important; } }
  </style>
  <link rel="stylesheet" href="assets/css/rox-motion.css">
  <script>
    (function () {
      var known = ["#glass-city", "#luminar", "#crystal-district", "#elevation", "#obsidian"];
      var destination = known.indexOf(window.location.hash) > -1 ? window.location.hash : "#collection-world";
      window.location.replace("index.html" + destination);
    }());
  </script>
  <script src="assets/js/rox-motion.js" defer></script>
</head>

    <a class="footer-email" href="mailto:roxhelpp@gmail.com">roxhelpp@gmail.com</a>

  </footer>

</html>
