<style>

/* ==========================================
   RESET
========================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

:root{

--navy:#050914;

--navy-light:#08101f;

--royal:#16366d;

--glass:rgba(255,255,255,.08);

--glass-border:rgba(255,255,255,.14);

--white:#ffffff;

--muted:#d7dce8;

--blue:#63b2ff;

--blue-light:#9fd4ff;

--radius:30px;

--shadow:

0 35px 90px rgba(0,0,0,.45);

}

body{

font-family:"Inter",sans-serif;

background:

radial-gradient(circle at top,

#17386d 0%,

#08101f 45%,

#050914 100%);

background-attachment:fixed;

color:var(--white);

overflow-x:hidden;

min-height:100vh;

line-height:1.75;

}

/* ==========================================
   PREMIUM BACKGROUND
========================================== */

body::before{

content:"";

position:fixed;

inset:0;

pointer-events:none;

z-index:-2;

background:

radial-gradient(circle at 15% 15%,

rgba(99,178,255,.12),

transparent 35%),

radial-gradient(circle at 85% 10%,

rgba(255,255,255,.05),

transparent 30%),

radial-gradient(circle at 50% 100%,

rgba(99,178,255,.08),

transparent 45%);

animation:backgroundFloat 18s ease-in-out infinite alternate;

}

@keyframes backgroundFloat{

0%{

transform:translateY(0);

}

100%{

transform:translateY(-80px);

}

}

/* ==========================================
   GLOBAL
========================================== */

.container{

width:min(1220px,92%);

margin:auto;

}

section{

padding:120px 0;

}

img{

display:block;

max-width:100%;

}

a{

text-decoration:none;

color:inherit;

}

h1,h2,h3{

font-weight:900;

letter-spacing:-.03em;

line-height:1.05;

}

p{

color:var(--muted);

font-size:1.05rem;

}

/* ==========================================
   GLASS SYSTEM
========================================== */

.glass{

background:var(--glass);

border:1px solid var(--glass-border);

border-radius:var(--radius);

backdrop-filter:blur(28px);

-webkit-backdrop-filter:blur(28px);

box-shadow:var(--shadow);

position:relative;

overflow:hidden;

}

.glass::before{

content:"";

position:absolute;

top:-180%;

left:-45%;

width:55%;

height:420%;

background:

linear-gradient(

120deg,

transparent,

rgba(255,255,255,.09),

transparent

);

transform:rotate(24deg);

animation:glassSweep 10s linear infinite;

}

@keyframes glassSweep{

100%{

transform:

translateX(260%)

rotate(24deg);

}
/* ==========================================
   FLOATING GLASS NAVIGATION
========================================== */

.navbar{

position:fixed;

top:22px;

left:50%;

transform:translateX(-50%);

width:min(1200px,94%);

padding:18px 32px;

display:flex;

align-items:center;

justify-content:space-between;

z-index:1000;

transition:
top .45s ease,
transform .45s ease,
background .45s ease,
box-shadow .45s ease;

}

.navbar.scrolled{

top:10px;

transform:translateX(-50%) scale(.97);

background:rgba(8,16,31,.82);

box-shadow:
0 18px 60px rgba(0,0,0,.35);

}

.logo{

font-size:1.6rem;

font-weight:900;

letter-spacing:.18em;

color:var(--white);

transition:.35s ease;

}

.logo:hover{

color:var(--blue-light);

transform:scale(1.03);

}

.nav-links{

display:flex;

align-items:center;

gap:34px;

}

.nav-links a{

position:relative;

font-weight:600;

font-size:1rem;

transition:.3s ease;

padding:6px 0;

}

.nav-links a::after{

content:"";

position:absolute;

left:0;

bottom:-5px;

width:0;

height:2px;

border-radius:999px;

background:var(--blue-light);

transition:.35s ease;

}

.nav-links a:hover{

color:var(--blue-light);

}

.nav-links a:hover::after{

width:100%;

}

/* ==========================================
   SUPPORT DROPDOWN
========================================== */

.dropdown{

position:relative;

}

.dropdown-content{

position:absolute;

top:58px;

right:0;

width:260px;

padding:16px;

display:flex;

flex-direction:column;

gap:10px;

border-radius:24px;

background:rgba(8,16,31,.96);

border:1px solid rgba(255,255,255,.10);

backdrop-filter:blur(24px);

-webkit-backdrop-filter:blur(24px);

box-shadow:

0 24px 70px rgba(0,0,0,.35);

opacity:0;

visibility:hidden;

transform:translateY(15px);

transition:.35s ease;

}

.dropdown:hover .dropdown-content{

opacity:1;

visibility:visible;

transform:translateY(0);

}

.dropdown-content a{

padding:12px 14px;

border-radius:14px;

transition:.3s ease;

}

.dropdown-content a:hover{

background:rgba(255,255,255,.08);

padding-left:18px;

color:var(--blue-light);

}

/* ==========================================
   MOBILE NAVIGATION
========================================== */

@media(max-width:900px){

.navbar{

padding:16px 22px;

}

.nav-links{

gap:20px;

}

}

@media(max-width:768px){

.nav-links{

display:none;

}

.navbar{

width:94%;

}

}
   /* ==========================================
   MAIN INTRODUCTION
========================================== */

.intro{

padding-top:220px;

padding-bottom:180px;

position:relative;

text-align:center;

}

.intro::before{

content:"";

position:absolute;

left:50%;

top:45%;

transform:translate(-50%,-50%);

width:520px;

height:520px;

border-radius:50%;

background:

radial-gradient(circle,

rgba(99,178,255,.10),

transparent 70%);

filter:blur(45px);

pointer-events:none;

animation:introGlow 8s ease-in-out infinite alternate;

}

@keyframes introGlow{

0%{

transform:

translate(-50%,-50%)

scale(.95);

opacity:.7;

}

100%{

transform:

translate(-50%,-50%)

scale(1.08);

opacity:1;

}

}

.intro-content{

max-width:820px;

margin:auto;

position:relative;

z-index:2;

}

.intro-content h1{

font-size:clamp(4rem,8vw,6.5rem);

font-weight:900;

line-height:.95;

letter-spacing:-.05em;

margin-bottom:30px;

color:var(--white);

}

.intro-content p{

max-width:650px;

margin:auto;

font-size:1.15rem;

line-height:2;

color:var(--muted);

}

/* ==========================================
   SCROLL INDICATOR
========================================== */

.scroll-indicator{

margin-top:80px;

display:flex;

justify-content:center;

}

.scroll-indicator span{

width:36px;

height:60px;

border-radius:999px;

border:2px solid rgba(255,255,255,.18);

display:flex;

justify-content:center;

padding-top:10px;

}

.scroll-indicator span::before{

content:"";

width:7px;

height:14px;

border-radius:999px;

background:var(--blue-light);

animation:scrollHint 2s ease-in-out infinite;

}

@keyframes scrollHint{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(22px);

opacity:0;

}

}

/* ==========================================
   RESPONSIVE INTRODUCTION
========================================== */

@media(max-width:768px){

.intro{

padding-top:180px;

padding-bottom:140px;

}

.intro-content h1{

font-size:3.3rem;

}

.intro-content p{

font-size:1rem;

line-height:1.9;

}

}
   /* ==========================================
   PREMIUM PROTECTED PREVIEWS
========================================== */

.preview-grid{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:20px;

margin:60px 0;

}

.preview{

position:relative;

aspect-ratio:9 / 19.5;

overflow:hidden;

border-radius:24px;

background:#08101f;

cursor:pointer;

transition:

transform .45s cubic-bezier(.22,1,.36,1),

box-shadow .45s;

}

.preview img{

width:100%;

height:100%;

object-fit:cover;

display:block;

filter:blur(3px) brightness(.82);

transition:

transform .55s ease,

filter .55s ease;

}

/* Dark overlay */

.preview .overlay{

position:absolute;

inset:0;

background:

rgba(5,9,20,.18);

z-index:2;

}

/* White X */

.preview .line1,

.preview .line2{

position:absolute;

top:50%;

left:50%;

width:150%;

height:5px;

background:

rgba(255,255,255,.38);

border-radius:999px;

z-index:3;

pointer-events:none;

}

.preview .line1{

transform:

translate(-50%,-50%)

rotate(45deg);

}

.preview .line2{

transform:

translate(-50%,-50%)

rotate(-45deg);

}

/* ROX Badge */

.preview .watermark{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

padding:12px 24px;

border-radius:999px;

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.16);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

font-weight:800;

letter-spacing:.35em;

font-size:.95rem;

color:white;

z-index:4;

pointer-events:none;

}

/* Hover */

.preview:hover{

transform:

translateY(-14px)

scale(1.04);

box-shadow:

0 35px 80px rgba(0,0,0,.42);

}

.preview:hover img{

transform:scale(1.08);

filter:blur(2px) brightness(.9);

}

.preview:hover .line1,

.preview:hover .line2{

background:

rgba(255,255,255,.5);

}

.preview:hover .watermark{

background:

rgba(99,178,255,.20);

border-color:

rgba(99,178,255,.35);

}

/* Tablet */

@media(max-width:1000px){

.preview-grid{

grid-template-columns:repeat(3,1fr);

}

}

/* Mobile */

@media(max-width:700px){

.preview-grid{

grid-template-columns:repeat(2,1fr);

gap:16px;

}

}
}
